name: Unit tests

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install autoconf automake cmake pkgconf m4 libtool

      - name: Prepare
        run: build-mac/bootstrap.sh

      - name: Run XCTest
        run: |
          xcodebuild test \
            -workspace build-mac/libetpan.xcworkspace \
            -scheme libetpan-unit-tests \
            -destination 'platform=macOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/.build/xcode" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build and run Unix test executables
        run: |
          framework_dir="$GITHUB_WORKSPACE/.build/xcode/Build/Products/Debug"
          mkdir -p unittest/Frameworks
          ditto "$framework_dir/libetpan.framework" \
            unittest/Frameworks/libetpan.framework
          make -C unittest check \
            LIBETPAN_TEST_DEPENDENCY= \
            LIBETPAN_TEST_LDLIBS="-F$framework_dir -framework libetpan"

  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            m4 \
            libsasl2-dev \
            libjson-c-dev \
            libxml2-dev \
            zlib1g-dev \
            libssl-dev \
            librnp-dev \
            libtidy-dev \
            libcurl4-openssl-dev \
            libicu-dev

      - name: Configure
        run: ./autogen.sh

      - name: Build
        run: make

      - name: Run unit tests
        run: make check
