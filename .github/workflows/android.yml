name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config perl python3 curl

      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Compute dependency cache key
        id: dependency-key
        run: |
          sources="$(git rev-parse HEAD:dependencies/submodules)"
          scripts="$(git rev-parse HEAD:build-android/dependencies)"
          echo "value=$sources-$scripts" >> "$GITHUB_OUTPUT"

      - name: Restore Android dependencies
        uses: actions/cache@v5
        with:
          path: build-android/dependencies/build/*-android
          key: android-${{ runner.os }}-${{ runner.arch }}-ndk-${{ env.NDK_VERSION }}-api23-all-abis-${{ steps.dependency-key.outputs.value }}-${{ hashFiles('.gitmodules') }}

      - name: Build native libraries for all supported ABIs
        run: build-android/build.sh

      - name: Link low-level feature smoke tests for all supported ABIs
        run: tests/android-link-smoke-test.sh
