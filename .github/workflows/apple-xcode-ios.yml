name: Apple Xcode iOS

on:
  push:
  pull_request:

jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install autoconf automake cmake pkgconf m4 libtool

      - name: Compute dependency cache key
        id: dependency-key
        run: |
          dependency_tree="$(git rev-parse HEAD:build-mac/dependencies)"
          submodule_tree="$(git rev-parse HEAD:dependencies/submodules)"
          xcode_version="$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)"
          echo "value=${dependency_tree}-${submodule_tree}-${xcode_version}" >> "$GITHUB_OUTPUT"

      - name: Restore Apple dependencies
        id: dependency-cache
        uses: actions/cache@v5
        with:
          path: |
            build-mac/dependencies/build/*.xcframework
            build-mac/dependencies/build/openssl/macos-universal
          key: ${{ github.workflow }}-macos-26-${{ runner.arch }}-libetpan-dependencies-${{ steps.dependency-key.outputs.value }}-${{ hashFiles('.gitmodules') }}

      - name: Prepare
        run: |
          arguments=()
          if [[ "${{ steps.dependency-cache.outputs.cache-hit }}" == "true" ]]; then
            arguments+=(--skip-dependencies)
          fi
          build-mac/bootstrap.sh "${arguments[@]}"

      - name: Build iOS device library
        run: |
          xcodebuild build \
            -workspace build-mac/libetpan.xcworkspace \
            -scheme 'libetpan ios' \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/.build/xcode-ios-device" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run iOS OpenSSL S/MIME XCTest
        run: |
          xcodebuild test \
            -workspace build-mac/libetpan.xcworkspace \
            -scheme libetpan-ios-smime-tests \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath "$GITHUB_WORKSPACE/.build/xcode-ios" \
            CODE_SIGNING_ALLOWED=NO
